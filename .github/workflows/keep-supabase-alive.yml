name: Keep Supabase Alive
on:
  schedule:
    - cron: '0 12 */3 * *'  # every 3 days
  workflow_dispatch:  # adds manual trigger button

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1/" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}"