  <script>!function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');t==='light'&&document.documentElement.setAttribute('data-theme','light')}()</script>
  <script>
    (function () {
      var img = new Image();
      img.onload = function () {
        var c = document.createElement('canvas');
        c.width = c.height = 64;
        var ctx = c.getContext('2d');
        ctx.beginPath();
        ctx.arc(32, 32, 32, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(img, 0, 0, 64, 64);
        var link = document.querySelector("link[rel='icon']") || document.createElement('link');
        link.rel = 'icon';
        link.href = c.toDataURL();
        document.head.appendChild(link);
      };
      img.src = '/image/Me.jpg';
    })();
  </script>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <script>
    (function () {
      var track = document.getElementById('home-carousel-track');
      if (!track) return;
      var _sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      _sb.from('carousel_settings').select('duration').eq('page', 'home').single()
        .then(function (res) {
          if (!res.error && res.data && res.data.duration) {
            track.style.animation = 'marquee ' + res.data.duration + 's linear infinite';
          }
        }).catch(function () {});

      _sb.from('carousel_images').select('url,crop').eq('page', 'home').order('sort_order', { ascending: true })
        .then(function (res) {
          if (res.error || !res.data || !res.data.length) return;
          track.innerHTML = '';
          function addCard(item, hidden) {
            var div = document.createElement('div');
            div.className = 'work-card';
            if (hidden) div.setAttribute('aria-hidden', 'true');
            var img = document.createElement('img');
            img.src = item.url;
            img.loading = hidden ? 'lazy' : 'eager';
            if (item.crop && item.crop.x !== undefined) {
              img.style.objectPosition = item.crop.x + '% ' + item.crop.y + '%';
            }
            div.appendChild(img);
            track.appendChild(div);
          }
          res.data.forEach(function (item) { addCard(item, false); });
          res.data.forEach(function (item) { addCard(item, true); });
        }).catch(function () {});
    })();
  </script>
  <script>
    function loadComponent(id, path, callback) {
      fetch(path)
        .then(r => r.text())
        .then(html => {
          document.getElementById(id).innerHTML = html;
          if (callback) callback();
        });
    }

    loadComponent('nav-component', '/components/nav/nav.html', initNav);
    loadComponent('footer-component', '/components/footer/footer.html', startWATClock);
  </script>
