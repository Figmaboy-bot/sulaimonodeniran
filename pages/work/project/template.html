<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Link preview: /api/project.js replaces this marker with per-project
       Open Graph / Twitter tags before the HTML leaves the server, so social
       crawlers (which never run our JS) see the real project. -->
  <!--OG_META-->
  <title>Project — Sulaimon Odeniran</title>
  <meta name="theme-color" content="#1a1a1a">
  <link rel="icon" type="image/png" sizes="64x64" href="/image/favicon-64.png">
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <script>!function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');if(t==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content','#f0eeeb')}}()</script>
  <link rel="preconnect" href="https://axpgphfcjzhyoimxxwrz.supabase.co">
  <link rel="preconnect" href="https://portfolio-storage-cdn.sulaimonodeniran.workers.dev">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/hepta-slab-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <!-- Fetch the shared nav/footer markup alongside the stylesheets instead of after all scripts have run -->
  <link rel="preload" href="/components/footer/footer.html" as="fetch" crossorigin>
  <link rel="stylesheet" href="/components/footer/footer.css">
  <link rel="stylesheet" href="/portfolio.css">
  <link rel="stylesheet" href="/pages/work/project/style.css">
</head>

<body>

  <main class="project-main">

    <a href="/pages/work/" class="project-back" id="back-btn">
      <img src="/image/Icons/Arrow.svg" alt="" class="back-arrow" />
      Back
    </a>

    <!-- Header, then the gallery: images, text rows and the project info
         (placed right after the cover by script.js), in the order set in admin -->
    <div class="project-content" id="project-gallery">
      <header class="project-header">
        <h1 class="project-title" id="project-title"></h1>
        <p class="project-tagline" id="project-tagline"></p>
      </header>

      <section class="project-info" id="project-info">
        <div class="text-col">
          <p class="meta-label">About</p>
          <p class="meta-body" id="project-about"></p>
        </div>
        <div class="project-side">
          <div class="project-meta">
            <div class="meta-row">
              <p class="meta-label">Industry</p>
              <p class="meta-value" id="project-industry"></p>
            </div>
            <div class="meta-row">
              <p class="meta-label">Role</p>
              <p class="meta-value" id="project-role"></p>
            </div>
            <div class="meta-row">
              <p class="meta-label">Year</p>
              <p class="meta-year" id="project-year"></p>
            </div>
          </div>
          <div class="project-ctas">
            <a href="#" class="btn-live-project" id="btn-live" style="display:none;" target="_blank" rel="noopener">
              View Live Project
              <img src="/image/Icons/Arrow.svg" alt="" />
            </a>
            <a href="mailto:odeniransulaimon18@gmail.com" class="btn-work-with-me">
              Work With Me
              <img src="/image/Icons/Arrow.svg" alt="" />
            </a>
          </div>
        </div>
      </section>
    </div>

    <!-- Previous / next project, filled by script.js -->
    <nav class="project-pager" id="project-pager" aria-label="More projects"></nav>

  </main>

  <div id="footer-component"></div>

  <!--PROJECT_DATA-->
  <script defer src="/components/footer/footer.js"></script>
  <script defer src="/scripts/load-components.js"></script>
  <script defer src="/scripts/transitions.js"></script>
  <script defer src="/supabase-config.js"></script>
  <script defer src="/data/snapshot.js"></script>
  <script defer src="/scripts/sb.js"></script>
  <script defer src="/scripts/cdn.js"></script>
  <script defer src="/data/projects.js"></script>
  <script defer src="/admin/imagedb.js"></script>
  <script defer src="/pages/work/project/script.js"></script>
  <script defer src="/scripts/track.js"></script>

</body>

</html>
