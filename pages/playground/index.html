<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playground — Ola</title>
  <meta name="description" content="Experiments, explorations, and side projects by Ola.">
  <meta name="theme-color" content="#1a1a1a">
  <link rel="icon" type="image/png" sizes="64x64" href="/image/favicon-64.png">
  <link rel="apple-touch-icon" href="/image/apple-touch-icon.png">
  <script>!function(){var t=localStorage.getItem('theme')||(matchMedia('(prefers-color-scheme:light)').matches?'light':'dark');if(t==='light'){document.documentElement.setAttribute('data-theme','light');var m=document.querySelector('meta[name=theme-color]');m&&m.setAttribute('content','#f0eeeb')}}()</script>
  <link rel="preconnect" href="https://axpgphfcjzhyoimxxwrz.supabase.co">
  <link rel="preconnect" href="https://portfolio-storage-cdn.sulaimonodeniran.workers.dev">
  <link rel="preload" as="font" type="font/woff2" href="/fonts/hepta-slab-latin.woff2" crossorigin>
  <link rel="preload" as="font" type="font/woff2" href="/fonts/instrument-serif-latin.woff2" crossorigin>
  <link rel="stylesheet" href="/fonts/fonts.css">
  <!-- Fetch the shared nav/footer markup alongside the stylesheets instead of after all scripts have run -->
  <link rel="preload" href="/components/nav/nav.html" as="fetch" crossorigin>
  <link rel="preload" href="/components/footer/footer.html" as="fetch" crossorigin>
  <link rel="stylesheet" href="/components/nav/nav.css">
  <link rel="stylesheet" href="/components/footer/footer.css">
  <link rel="stylesheet" href="/portfolio.css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div id="nav-component"></div>

  <main class="playground-main">

    <div class="playground-label-row">
      <p class="playground-label">Playground</p>
    </div>

    <div class="playground-grid" id="playground-grid"></div>

  </main>

  <div id="footer-component"></div>

  <!-- Bottom sheet modal -->
  <div class="pg-modal-overlay" id="pg-modal-overlay" aria-hidden="true">
    <div class="pg-modal" id="pg-modal" role="dialog" aria-modal="true">
      <div class="pg-modal-header">
        <div class="pg-modal-heading">
          <p class="pg-modal-title" id="pg-modal-title"></p>
          <p class="pg-modal-desc" id="pg-modal-desc"></p>
        </div>
        <a class="pg-modal-live-link btn-primary" id="pg-modal-live-link" href="#" target="_blank" rel="noopener noreferrer" style="display:none;">
          View Live
          <img src="/image/Icons/Arrow.svg" alt="" class="btn-arrow" />
        </a>
        <button class="pg-modal-close" id="pg-modal-close" aria-label="Close">
          <span></span>
          <span></span>
        </button>
      </div>
      <div class="pg-modal-image-wrap" id="pg-modal-media-wrap"></div>
    </div>
  </div>

  <script defer src="/components/nav/nav.js"></script>
  <script defer src="/components/footer/footer.js"></script>
  <script defer src="/scripts/load-components.js"></script>
  <script defer src="/scripts/transitions.js"></script>
  <script defer src="/supabase-config.js"></script>
  <script defer src="/scripts/sb.js"></script>
  <script defer src="/scripts/cdn.js"></script>
  <script defer src="script.js"></script>
  <script defer src="/scripts/track.js"></script>

</body>

</html>
